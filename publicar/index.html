document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n          <div data-reveal=\"\" style=\"animation-delay:{{ m.delay }};\">\n            <div style=\"font-family:Fraunces, Georgia, serif; font-weight:500; font-size:clamp(28px,3.2vw,42px); letter-spacing:-0.03em; line-height:1; color:#8fd3b6;\">{{ m.value }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:#a4aca2; margin-top:9px; text-wrap:pretty;\">{{ m.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:clamp(32px,4vw,56px) clamp(22px,4vw,60px) clamp(44px,5vw,76px); max-width:1240px;\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:clamp(24px,3.6vw,56px);\">\n        <div data-reveal=\"\">\n          <p style=\"font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:#1a7a5e; margin:0 0 10px;\">{{ t.lblChallenge }}<\u002Fp>\n          <p style=\"font-size:16px; line-height:1.64; color:#3a423c; margin:0 0 28px; text-wrap:pretty;\">{{ current.challenge }}<\u002Fp>\n          <p style=\"font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:#1a7a5e; margin:0 0 10px;\">{{ t.lblRole }}<\u002Fp>\n          <p style=\"font-size:16px; line-height:1.64; color:#3a423c; margin:0 0 28px; text-wrap:pretty;\">{{ current.roleText }}<\u002Fp>\n          <p style=\"font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:#1a7a5e; margin:0 0 10px;\">{{ t.lblResult }}<\u002Fp>\n          <p style=\"font-size:16px; line-height:1.64; color:#3a423c; margin:0; text-wrap:pretty;\">{{ current.result }}<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:#1a7a5e; margin:0 0 14px;\">{{ t.lblProcess }}<\u002Fp>\n          <sc-for list=\"{{ current.process }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div data-reveal=\"\" style=\"display:grid; grid-template-columns:34px minmax(0,1fr); gap:11px; padding:15px 0; border-top:1px solid rgba(21,24,28,.14);\">\n              <span style=\"font-size:12.5px; color:#5e675f; padding-top:4px;\">{{ p.n }}<\u002Fspan>\n              <div>\n                <div style=\"font-size:15.5px; font-weight:600;\">{{ p.title }}<\u002Fdiv>\n                <p style=\"font-size:14.5px; color:#5e675f; margin:4px 0 0; text-wrap:pretty;\">{{ p.body }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:clamp(32px,4vw,52px); padding-top:22px; border-top:1px solid rgba(21,24,28,.16); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px;\">\n        <div>\n          <p style=\"font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:#5e675f; margin:0 0 7px;\">{{ t.nextLabel }}<\u002Fp>\n          <a href=\"{{ next.href }}\" sc-camel-on-click=\"{{ next.open }}\" style=\"font-family:Fraunces, Georgia, serif; font-weight:500; font-size:clamp(19px,2.1vw,27px); letter-spacing:-0.02em; transition:color .25s var(--ease-out);\" style-hover=\"color:#1a7a5e;\">{{ next.title }} <span data-arrow=\"\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <a href=\"#proyectos\" sc-camel-on-click=\"{{ goWorkSection }}\" style=\"font-size:13.5px; border:1px solid rgba(21,24,28,.25); border-radius:999px; padding:11px 19px; transition:border-color .25s var(--ease-out), color .25s var(--ease-out);\" style-hover=\"border-color:#1a7a5e; color:#1a7a5e;\">{{ t.allWork }}<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;cvUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenido&quot;}}\">\nconst D = window.AG_PORTFOLIO || { cases: [], stats: {}, skills: {}, jobs: {}, certs: [] };\n\nconst COPY = {\n  es: {\n    langLabel: \"English\",\n    greeting: \"Hola, soy Alejandra.\",\n    methodKicker: \"Cómo trabajo\",\n    navWork: \"Proyectos\", navAbout: \"Sobre mí\", navPath: \"Trayectoria\", navEdu: \"Formación\", navContact: \"Contacto\",\n    badge: \"Bogotá · Colombia, Ecuador y Panamá · Abierta a nuevos retos\",\n    hi: \"Hago que una marca diga lo mismo en tres países.\",\n    lede1: \"Soy Alejandra García, estratega de contenido y marca para compañías B2B en Latinoamérica. Más de 5 años entre estrategia de contenidos, identidad verbal, campañas integradas, SEO y AEO — del brief a la ejecución, con los equipos que producen.\",\n    ctaWork: \"Ver proyectos\", ctaContact: \"Escríbeme\", ctaCv: \"Descargar CV\",\n    workTitle: \"Proyectos\", workNote: \"Cada proyecto: reto · rol · proceso · resultado · métricas\",\n    aboutTitle: \"Sobre mí\",\n    about1: \"Trabajo en la intersección entre contenido, marca y negocio: traduzco producto complejo a lenguaje con el que alguien decide.\",\n    about2: \"Soy comunicadora social de la Universidad Santo Tomás, con diploma honorífico Cum Laude. Mi recorrido pasó por banca de desarrollo (CAF), entretenimiento (Salitre Mágico), educación (Scala Learning) y tecnología geoespacial (Esri).\",\n    about3: \"De ahí viene lo que más uso hoy: criterio editorial, disciplina de dato y la costumbre de coordinar diseño, web, audiovisual y agencias sin perder la línea de la marca.\",\n    photoTag: \"Bogotá, Colombia · Disponible para roles regionales\",\n    pathTitle: \"Trayectoria\", pathNote: \"Banca de desarrollo · Entretenimiento · Educación · Tecnología\",\n    eduTitle: \"Formación y certificaciones\",\n    eduLede: \"Comunicación Social · Universidad Santo Tomás · Diploma honorífico Cum Laude · 2016 – 2020\",\n    contactKicker: \"Disponible para conversar\",\n    contactTitle: \"Busco un rol donde el contenido sea una decisión de negocio, no un entregable.\",\n    contactLede: \"Me interesan compañías con operación regional y agenda de sostenibilidad o impacto, donde la comunicación tenga que sostener varios mercados a la vez.\",\n    phoneLabel: \"Teléfono / WhatsApp\",\n    backLabel: \"Volver a proyectos\", allWork: \"Todos los proyectos\", nextLabel: \"Siguiente proyecto\",\n    heroSlotHint: \"Imagen principal del proyecto\", caseImgHint: \"Imagen del proyecto\",\n    chatCaption: \"Simulación del flujo conversacional · contenido provisional\",\n    lblChallenge: \"El reto\", lblRole: \"Mi rol\", lblProcess: \"Proceso\", lblResult: \"Resultado\",\n    method: [\n      { title: \"Primero el criterio, después la pieza\", body: \"Cada campaña arranca en un brief con una sola idea y una audiencia definida. La pieza es consecuencia, no punto de partida.\" },\n      { title: \"Una marca, tres mercados\", body: \"Un marco de mensajes clave con variantes permitidas y límites explícitos: matiz local sin perder coherencia regional.\" },\n      { title: \"Solo cifras que puedo sostener\", body: \"Publico las métricas que existen y señalo las que están por documentar. Ese criterio aplica también a este portafolio.\" }\n    ]\n  },\n  en: {\n    langLabel: \"Español\",\n    greeting: \"Hi, I'm Alejandra.\",\n    methodKicker: \"How I work\",\n    navWork: \"Projects\", navAbout: \"About\", navPath: \"Career\", navEdu: \"Education\", navContact: \"Contact\",\n    badge: \"Bogotá · Colombia, Ecuador and Panama · Open to new roles\",\n    hi: \"I make one brand say the same thing in three countries.\",\n    lede1: \"I'm Alejandra García, a content and brand strategist for B2B companies across Latin America. 5+ years across content strategy, verbal identity, integrated campaigns, SEO and AEO — brief to launch, with the teams that produce.\",\n    ctaWork: \"View projects\", ctaContact: \"Get in touch\", ctaCv: \"Download CV\",\n    workTitle: \"Projects\", workNote: \"Every project: challenge · role · process · result · metrics\",\n    aboutTitle: \"About me\",\n    about1: \"I work where content, brand and business meet: I translate complex products into language someone can decide with.\",\n    about2: \"I'm a social communicator from Universidad Santo Tomás, graduated Cum Laude. My path runs through development banking (CAF), entertainment (Salitre Mágico), education (Scala Learning) and geospatial technology (Esri).\",\n    about3: \"That's where today's toolkit comes from: editorial judgment, discipline with data, and the habit of coordinating design, web, video and agencies without losing the brand line.\",\n    photoTag: \"Bogotá, Colombia · Open to regional roles\",\n    pathTitle: \"Career\", pathNote: \"Development banking · Entertainment · Education · Technology\",\n    eduTitle: \"Education & certifications\",\n    eduLede: \"Social Communication · Universidad Santo Tomás · Cum Laude · 2016 – 2020\",\n    contactKicker: \"Open to a conversation\",\n    contactTitle: \"I'm looking for a role where content is a business decision, not a deliverable.\",\n    contactLede: \"I'm drawn to companies with regional operations and a sustainability or impact agenda, where communication has to hold several markets at once.\",\n    phoneLabel: \"Phone / WhatsApp\",\n    backLabel: \"Back to projects\", allWork: \"All projects\", nextLabel: \"Next project\",\n    heroSlotHint: \"Project hero image\", caseImgHint: \"Project image\",\n    chatCaption: \"Conversation flow simulation · placeholder content\",\n    lblChallenge: \"The challenge\", lblRole: \"My role\", lblProcess: \"Process\", lblResult: \"Result\",\n    method: [\n      { title: \"Criteria first, asset second\", body: \"Every campaign starts from a brief with one idea and a defined audience. The asset is a consequence, not a starting point.\" },\n      { title: \"One brand, three markets\", body: \"A key-message framework with allowed variants and explicit limits: local nuance without losing regional consistency.\" },\n      { title: \"Only numbers I can defend\", body: \"I publish the metrics that exist and flag the ones still to be documented. That rule applies to this portfolio too.\" }\n    ]\n  }\n};\n\nconst SECTIONS = [\n  { id: \"proyectos\", key: \"navWork\" },\n  { id: \"sobre\", key: \"navAbout\" },\n  { id: \"trayectoria\", key: \"navPath\" },\n  { id: \"formacion\", key: \"navEdu\" },\n  { id: \"contacto\", key: \"navContact\" }\n];\n\nclass Component extends DCLogic {\n  state = { lang: \"es\", slug: null, count: 1, active: \"\", menuOpen: false };\n\n  componentDidMount() {\n    this.syncHash();\n    this._onHash = () => this.syncHash();\n    window.addEventListener(\"hashchange\", this._onHash);\n    this.observe();\n    const pane = document.getElementById(\"pane\");\n    if (pane) {\n      this._onScroll = () => this.trackActive();\n      pane.addEventListener(\"scroll\", this._onScroll, { passive: true });\n    }\n  }\n  componentDidUpdate() { this.observe(); }\n  componentWillUnmount() {\n    window.removeEventListener(\"hashchange\", this._onHash);\n    const pane = document.getElementById(\"pane\");\n    if (pane && this._onScroll) pane.removeEventListener(\"scroll\", this._onScroll);\n    if (this._io) this._io.disconnect();\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n\n  trackActive() {\n    const pane = document.getElementById(\"pane\");\n    if (!pane || this.state.slug) return;\n    let active = \"\";\n    SECTIONS.forEach(s => {\n      const el = document.getElementById(s.id);\n      if (el && el.getBoundingClientRect().top < window.innerHeight * 0.42) active = s.id;\n    });\n    if (active !== this.state.active) this.setState({ active });\n  }\n\n  observe() {\n    const pane = document.getElementById(\"pane\");\n    if (!pane) return;\n    if (!this._io) {\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach(e => {\n          if (e.isIntersecting) { e.target.setAttribute(\"data-in\", \"\"); this._io.unobserve(e.target); }\n        });\n      }, { root: pane, rootMargin: \"0px 0px -6% 0px\", threshold: 0.05 });\n    }\n    pane.querySelectorAll(\"[data-reveal]:not([data-in])\").forEach(el => this._io.observe(el));\n  }\n\n  runCount() {\n    if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) { this.setState({ count: 1 }); return; }\n    const t0 = performance.now();\n    this.setState({ count: 0 });\n    const step = (now) => {\n      const p = Math.min(1, (now - t0) / 1100);\n      this.setState({ count: 1 - Math.pow(1 - p, 3) });\n      if (p < 1) this._raf = requestAnimationFrame(step);\n    };\n    this._raf = requestAnimationFrame(step);\n  }\n\n  syncHash() {\n    const h = (window.location.hash || \"\").replace(/^#/, \"\");\n    const m = h.match(/^proyecto\\/(.+)$/);\n    this.setState({ slug: m && D.cases.some(c => c.slug === m[1]) ? m[1] : null });\n  }\n\n  scrollToSection(id) {\n    const pane = document.getElementById(\"pane\");\n    const el = document.getElementById(id);\n    if (!pane) return;\n    if (!el || id === \"inicio\") { pane.scrollTo({ top: 0, behavior: \"smooth\" }); return; }\n    pane.scrollTo({ top: pane.scrollTop + el.getBoundingClientRect().top - 8, behavior: \"smooth\" });\n  }\n\n  goSection(id) {\n    return (e) => {\n      if (e) e.preventDefault();\n      const wasCase = !!this.state.slug;\n      if (wasCase) {\n        window.location.hash = id;\n        this.setState({ slug: null, active: id === \"inicio\" ? \"\" : id });\n        setTimeout(() => this.scrollToSection(id), 80);\n      } else {\n        window.location.hash = id;\n        this.scrollToSection(id);\n      }\n    };\n  }\n\n  openCase(slug) {\n    return (e) => {\n      if (e) e.preventDefault();\n      window.location.hash = \"proyecto/\" + slug;\n      this.setState({ slug });\n      const pane = document.getElementById(\"pane\");\n      if (pane) pane.scrollTop = 0;\n    };\n  }\n\n  shownValue(raw) {\n    const p = this.state.count;\n    if (p >= 1) return raw;\n    const m = String(raw).match(/^([^\\d]*)(\\d+)([^\\d]*)$/);\n    if (!m) return raw;\n    return m[1] + Math.round(parseInt(m[2], 10) * p) + m[3];\n  }\n\n  renderVals() {\n    const lang = this.state.lang;\n    const t = COPY[lang];\n    const cvHref = (this.props.cvUrl || \"\").trim() || \"cv/Alejandra-Garcia-CV.pdf\";\n\n    const list = D.cases.map((c, i) => {\n      const L = c[lang] || {};\n      return {\n        n: c.n, slug: c.slug, client: c.client, year: c.year,\n        isChat: c.illo === \"chat\", isPhoto: c.illo !== \"chat\",\n        slotId: c.slot + \"-thumb\", slotHint: t.caseImgHint, heroSlot: c.slot + \"-hero\",\n        href: \"#proyecto/\" + c.slug, open: this.openCase(c.slug),\n        delay: (i * 0.05).toFixed(2) + \"s\",\n        title: L.title, summary: L.summary, headline: L.headline, tags: L.tags,\n        challenge: L.challenge, roleText: L.roleText, result: L.result,\n        process: L.process || [],\n        metrics: (L.metrics || []).map((m, k) => ({ value: m.value, label: m.label, delay: (k * 0.07).toFixed(2) + \"s\" }))\n      };\n    });\n    const idx = list.findIndex(c => c.slug === this.state.slug);\n    const active = this.state.active;\n\n    return {\n      t, lang, cvHref,\n      isHome: idx < 0, isCase: idx >= 0,\n      nav: SECTIONS.map(s => ({\n        label: t[s.key], href: \"#\" + s.id, go: this.goSection(s.id),\n        goMobile: (e) => { this.setState({ menuOpen: false }); this.goSection(s.id)(e); },\n        scale: (idx < 0 && active === s.id) || (idx >= 0 && s.id === \"proyectos\") ? 1 : 0,\n        color: (idx < 0 && active === s.id) || (idx >= 0 && s.id === \"proyectos\") ? \"#15181c\" : \"#5e675f\"\n      })),\n      cases: list,\n      current: idx >= 0 ? list[idx] : (list[0] || {}),\n      next: list.length ? list[(Math.max(idx, 0) + 1) % list.length] : {},\n      stats: (D.stats[lang] || []).map((s, i) => ({ shown: s.value, label: s.label, delay: (i * 0.07).toFixed(2) + \"s\" })),\n      m1: t.method[0], m2: t.method[1], m3: t.method[2],\n      skills: D.skills[lang] || [],\n      jobs: (D.jobs[lang] || []).map((j, i) => Object.assign({}, j, { delay: (i * 0.06).toFixed(2) + \"s\" })),\n      certs: D.certs.map((c, i) => ({ name: c.name[lang], org: c.org, date: c.date[lang], delay: (i * 0.05).toFixed(2) + \"s\" })),\n      menuOpen: this.state.menuOpen,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      goTop: this.goSection(\"inicio\"),\n      goWorkSection: this.goSection(\"proyectos\"),\n      toggleLang: () => this.setState(s => ({ lang: s.lang === \"es\" ? \"en\" : \"es\" }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
